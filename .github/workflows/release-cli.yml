name: Release CLI

# Publishes @frontendchecklist/cli to npm with provenance.
# Trigger: push a tag like `cli-v1.0.0` (must match packages/cli/package.json), or run manually.
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @frontendchecklist/cli
    if: github.repository == 'thedaviddias/Front-End-Checklist'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance (and trusted publishing once configured on npmjs.com).
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          [ "cli-v${version}" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build and test
        run: pnpm --filter @frontendchecklist/cli test
      - name: Publish
        working-directory: packages/cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
