  "@radix-ui/react-slot": "^1.3.3"
  "@radix-ui/react-switch": "^1.3.7"
  "@radix-ui/react-tabs": "^1.1.21"
  "@radix-ui/react-tooltip": "^1.2.16"
  # TanStack
  "@tanstack/react-query": "^5.104.0"
  # Testing
  "@testing-library/react": "^16.3.3"
  "@types/jest": "^30.0.0"
  "@types/node": "^25.9.8"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
